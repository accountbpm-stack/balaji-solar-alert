plugins {
    id 'com.android.application'
}

// Firebase (instant push) is switched on only when app/google-services.json is present
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.balajigroup.solaralert'
    compileSdk 34

    defaultConfig {
        applicationId 'com.balajigroup.solaralert'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        balaji {
            storeFile file('balaji-solar.keystore')
            storePassword 'BalajiSolar@2026'
            keyAlias 'balajisolar'
            keyPassword 'BalajiSolar@2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.balaji
        }
        debug {
            signingConfig signingConfigs.balaji
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
