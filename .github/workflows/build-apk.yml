name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BalajiSolarAlert.apk

      - name: Upload APK (Actions → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BalajiSolarAlert-apk
          path: BalajiSolarAlert.apk

      - name: Publish as a Release (Releases → Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Balaji Solar Alert – build ${{ github.run_number }}
          files: BalajiSolarAlert.apk
          make_latest: true
